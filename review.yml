    - url: https://api.medibank.com.au/
      httpStatus: 000
      dns: 203.37.77.144
      note: |
        Resolves but the TLS connection times out after 20 seconds and a raw
        TCP check on port 443 reports closed or filtered. Not reachable from
        the public internet, so nothing can be classified as an API surface.
    - url: https://www.medibank.com.au/developers/
      httpStatus: 404
    - url: https://www.medibank.com.au/api/
      httpStatus: 404
    - url: https://www.medibank.com.au/developer/
