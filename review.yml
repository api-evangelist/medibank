aid: medibank
name: Medibank
review:
  question: Does Medibank expose a real, self-serve public API surface for developers?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Australia
  tier: carrier-life-health
findings:
  summary: |
    Medibank Private Limited is Australia's largest private health insurer,
    listed on the ASX as MPL and operating the Medibank and ahm retail brands
    plus the Amplar Health services arm. It publishes no developer portal and
    no public API of any kind. Every conventional developer host and path was
    probed on 2026-07-25 and none is a developer surface: developer,
    developers, docs and apis subdomains of medibank.com.au return no DNS
    answer at all; api.medibank.com.au resolves to 203.37.77.144 but does not
    accept a public TCP connection on port 443 (curl times out after 20s, and
    a raw port check reports the port closed or filtered); and
    /developers, /api, /developer, /partners and /integrations all return
    HTTP 404 on www.medibank.com.au. The site's own sitemap.xml (HTTP 200,
    178,587 bytes, 1,364 <loc> entries) contains no developer, API, SDK or
    integration page.

    The only first-party integration surfaces are login walls and email-gated
    onboarding. providers.medibank.com.au ("Medibank - Provider Self Service",
    branded Provider Central / ESP on the public provider pages) returns
    HTTP 200 but is a React single-page application with catch-all routing —
    it serves the same 2,143-byte index.html shell for every path, including
    /.well-known/openid-configuration, so a 200 there carries no information.
    portal.medibank.com.au is a Palo Alto Networks GlobalProtect corporate VPN
    (redirects to /global-protect/login.esp). partner.medibank.com.au resolves
    to CloudFront but fails the TLS handshake for that SNI, so nothing is
    served. eclipse.medibank.com.au and my.medibank.com.au resolve in DNS but
    do not accept public connections on port 443 — private claiming and member
    endpoints, not developer surfaces.

    The real machine-to-machine claiming rails in this market are third-party
    and government-operated rather than Medibank-published. ECLIPSE — the
    Services Australia (Medicare Australia) in-patient online claiming system —
    is the transport Medibank documents for hospital claims and for 25 percent
    Fund Gap medical claims from Simplified Billing Agents under claim type
    "MB", and it also serves the Online Eligibility Check (OEC) with
    Presenting Illness (PIL) codes. ECFWeb and THELMA are named as alternative
    eligibility-check channels for providers without ECLIPSE OEC access.
    HICAPS and iSOFT terminals carry ancillary claiming. The MPPA billing
    channel for pathology and diagnostic imaging is onboarded by phone and
    email. Hospital Casemix Protocol (HCP) data is submitted through a Medibank
    HCP Portal whose access is granted only by emailing hcp@medibank.com.au,
    with the data specification itself published by the Australian Department
    of Health and Aged Care, not by Medibank.

    This is the expected posture for an Australian private health insurer.
    APRA supervises prudentially, the Private Health Insurance Ombudsman
    handles conduct, and the Consumer Data Right that opened Australian banking
    and energy was designated to extend to general insurance and then deferred
    and de-prioritised — and would not have reached private health insurance in
    any case. There is no open-insurance obligation, no FHIR-style mandate on
    the fund, and consequently no forcing function that would put a Medibank
    API in front of an unauthenticated developer.
