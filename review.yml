actions:
  openapiHarvested: 0
  apisListed: 0
  apisYmlCreated: true
  reason: |
    Medibank publishes no public, self-serve API and no developer portal, so
    apis[] is intentionally empty. Recording that absence accurately — together
    with the ECLIPSE, HCP, HICAPS and iSOFT rails that actually carry the
    company's machine-to-machine claiming traffic, and the confirmed absence of
    any ACORD reference — is the correct outcome for an Australian private
    health insurer in a market where the Consumer Data Right never reached
    insurance.
