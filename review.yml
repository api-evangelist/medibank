    - url: https://www.medibank.com.au/partners/
      httpStatus: 404
    - url: https://www.medibank.com.au/integrations/
      httpStatus: 404
    - url: https://www.medibank.com.au/sitemap.xml
      httpStatus: 200
      note: |
        1,364 URLs. Filtering for develop/api/integrat/partner/innovat/tech/
        digital returns only unrelated marketing and sustainability pages. No
        developer or API page exists in the site's own index.
    gatedSurfaces:
    - name: Medibank Provider Self Service (Provider Central / ESP)
      url: https://providers.medibank.com.au/
      httpStatus: 200
      platform: React single-page application
      classification: partner/provider login wall
      selfServe: false
      note: |
        Title is "Medibank - Provider Self Service". The server returns the
        same 2,143-byte index.html shell for every path — /.well-known/
        openid-configuration, /static/js/main.54175f54.chunk.js and any
        arbitrary route all return the shell with HTTP 200 — so no API
        catalog, no OIDC discovery document and no JavaScript bundle can be
        read anonymously. Linked from www.medibank.com.au/providers/ as
        "Provider Central (ESP)". It is a healthcare-provider servicing
        application for practitioners and hospitals, not a developer portal.
    - name: Medibank corporate remote access
      url: https://portal.medibank.com.au/
      httpStatus: 404
      finalURL: https://portal.medibank.com.au/global-protect/login.esp
      classification: Palo Alto Networks GlobalProtect VPN login
      note: Corporate remote-access gateway. Not a developer or partner API surface.
    - name: partner.medibank.com.au
      httpStatus: 000
      dns: d3d2yftvyd4ze4.cloudfront.net (18.239.183.0/24)
      classification: not serving
      note: |
        TCP 443 connects but the TLS handshake fails (sslv3 alert handshake
        failure) — the CloudFront distribution has no certificate for this
        SNI, so no content is published on this host.
    - name: eclipse.medibank.com.au
      httpStatus: 000
      dns: 103.247.118.108
      classification: private claiming endpoint
      note: |
        Resolves but port 443 is closed or filtered from the public internet.
        Named after ECLIPSE, the Services Australia online claiming system.
        Not publicly documented and not reachable.
    - name: my.medibank.com.au
      httpStatus: 000
      dns: 203.41.198.109
      classification: member endpoint, not publicly reachable
    - name: HCP Portal (Hospital Casemix Protocol)
      url: https://www.medibank.com.au/providers/hospital/
      httpStatus: 200
      classification: email-gated data submission portal
      note: |
        Quoted from the page: "To help with reporting obligations, we have an
        HCP Portal that allows hospitals to submit HCP data securely to
        Medibank. To get access to the HCP Portal, please email your request
        to our HCP team at: hcp@medibank.com.au. For information about HCP
        requirements and current specifications please visit the Department of
        Health and Aged Care." The portal URL itself is not published and the
        data specification is a government artifact, not a Medibank one.
  acordPosture:
    posture: no ACORD reference found
    detail: |
      No occurrence of ACORD, AL3, ACORD XML, NGDS or ACORD certification
      appears anywhere on Medibank's public web estate — not on the corporate
      site, not in the 1,364-URL sitemap, not on any provider or claiming
      page, and not in the GitHub organization. This is the correct and
      expected result rather than a gap in the review: ACORD's AL3 and ACORD
      XML standards serve property and casualty and life carriers and their
      agency management systems, and Australian private health insurance is
      governed by an entirely different data regime. The transports Medibank
      actually names are ECLIPSE (Services Australia), the Hospital Casemix
      Protocol (Department of Health and Aged Care), the Medicare Benefits
      Schedule item numbers and ECLIPSE Presenting Illness codes, and the
      HICAPS and iSOFT terminal networks. ECLIPSE and HCP are the Australian
      health-fund analogue of an ACORD posture, and neither is a Medibank
      publication.
  insuranceVerbs:
    quote:
      exposed: false
      note: |
        Quoting is a first-party web funnel only (Get a quote across health,
        travel, pet, life and income protection). No public quote API, and no
        documented aggregator or comparison API.
    bind:
      exposed: false
      note: No public bind or purchase API. Policy purchase is web and call-centre only.
    issue:
      exposed: false
      note: |
        No public policy-issue or policy-administration API. Membership
        servicing is done through the My Medibank member web app and app.
    fnol:
      exposed: false
      audience: partner-only
      note: |
        Claims intake is real but entirely partner-gated and third-party
        transported. Hospital claims and 25 percent Fund Gap medical claims
        are lodged via ECLIPSE (claim type "MB" for Simplified Billing
        Agents); ancillary claims go through HICAPS and iSOFT terminals;
        pathology and diagnostic imaging goes through the MPPA billing
        channel, onboarded by phone on 1300 130 460 and email to
        MPPA@medibank.com.au. Member-side claiming is via the My Medibank app,
        in store, or paper form. None of these is a documented Medibank API.
  transports:
  - protocol: REST
    documented: false
    note: No public REST API is documented on any Medibank host.
  - protocol: GraphQL
    documented: false
    note: No /graphql surface was found or introspected.
  - protocol: gRPC
    documented: false
    note: No published .proto or gRPC reference found.
  - protocol: WebSocket
    documented: false
    note: No WebSocket endpoint documented.
  - protocol: ECLIPSE (Services Australia online claiming)
    documented: true
    firstParty: false
    note: |
      Third-party, government-operated claiming transport that Medibank
      participates in. Registration is with Services Australia (Medicare
      Australia eBusiness Service Centre, 1800 700 199,
      co.eclipse@medicareaustralia.gov.au), not with Medibank. Carries
      hospital claims, 25 percent Fund Gap medical claims under claim type
      "MB", and the Online Eligibility Check (OEC) with Presenting Illness
      (PIL) codes. Rejection codes are generated by ECLIPSE and documented in
      the ECLIPSE Online Hospital Claiming User Guide published by Services
      Australia.
  - protocol: ECFWeb
    documented: true
    firstParty: false
    note: Named on the Medibank hospital provider page as an alternative eligibility-check channel for providers without ECLIPSE OEC access.
  - protocol: THELMA
    documented: true
    firstParty: false
    note: Named alongside ECFWeb as an alternative eligibility-check channel.
  - protocol: HICAPS / iSOFT terminal claiming
    documented: true
    firstParty: false
    note: Ancillary (extras) claiming runs through HICAPS and iSOFT practice terminals. Medibank maintains a "HICAPS and iSOFT updates" provider page.
  - protocol: HCP file submission (Hospital Casemix Protocol)
    documented: true
    firstParty: partial
    note: |
      Medibank runs an HCP Portal for hospitals to submit Hospital Casemix
      Protocol data. Access is granted by emailing hcp@medibank.com.au. The
      specification is published by the Australian Department of Health and
      Aged Care.
  authModel:
    public: false
    schemes: []
    note: |
      No documented authentication scheme for any Medibank API, because no
      public API exists. The provider and member applications are
      session-based web login walls. No API key programme, no OAuth2 client
      credentials or authorization code flow, no mTLS onboarding and no SAML
      partner federation is documented publicly.
    wellKnown:
    - url: https://www.medibank.com.au/.well-known/openid-configuration
      httpStatus: 301
      note: Redirects into the marketing site; no OIDC discovery document served.
    - url: https://www.medibank.com.au/.well-known/oauth-authorization-server
      httpStatus: 301
      note: Redirects into the marketing site; no authorization-server metadata served.
    - url: https://providers.medibank.com.au/.well-known/openid-configuration
      httpStatus: 200
      note: |
        Returns the React application's index.html shell, not JSON. A false
        positive caused by SPA catch-all routing, not an OIDC document.
    - url: https://members.medibank.com.au/.well-known/openid-configuration
      httpStatus: 404
    - url: https://www.medibank.com.au/security.txt
      httpStatus: 404
  webhooks:
    published: false
    note: No event catalog, no webhook documentation and no AsyncAPI definition was found.
  postman:
    published: false
    note: No public Postman workspace or collection was found for Medibank.
  openapi:
    harvested: false
    count: 0
    note: |
      No OpenAPI or Swagger document exists to harvest. There is no host that
      serves one: the candidate spec paths could not even be probed
      meaningfully because api.medibank.com.au refuses public connections and
      no other API host resolves. The openapi/ directory is therefore omitted
      from this repository.
  sourceCode:
    githubOrganization: https://github.com/Medibank
    httpStatus: 200
    publicRepos: 12
    created: '2023-03-24'
    note: |
      The organization publishes only recruitment coding challenges
      (coding-challenge-web, coding-challenge-android, coding-challenge-ios,
      coding-challenge-api, coding-challenge-generic,
      ventures-code-review-exercise-ios, ventures-code-review-exercise-android)
      and forks or copies of Adobe Experience Manager OpenCloud tooling
      (cloud-aem-platform-buildenv, cloud-aem-stack-manager-cloud,
      cloud-puppet-aem-orchestrator, iOSKruxLibUniversal) plus a Storybook
      fork. "coding-challenge-api" is a hiring exercise, not a product API. No
      OpenAPI, AsyncAPI, SDK or client library is published.
  brandsAndEntities:
  - name: Medibank
    url: https://www.medibank.com.au/
    note: Primary private health insurance brand. Medibank Private Limited, ABN 47 080 890 259, ASX code MPL.
  - name: ahm
    url: https://ahm.com.au/
    httpStatus: 200
    note: |
      Second retail health insurance brand. /developers and /api both return
      HTTP 404; api.ahm.com.au and developer.ahm.com.au do not resolve. No
      developer surface.
  - name: Amplar Health
    url: https://amplarhealth.com.au/
    httpStatus: 403
    note: |
      Medibank's health services arm. medibankhealth.com.au redirects here.
      The host returns HTTP 403 to an anonymous scripted request; no developer
      surface is advertised.
  linesOfBusiness:
  - Private health insurance (hospital, extras, ambulance)
  - Overseas Student Health Cover (OSHC) and Overseas Visitors Health Cover
  - Travel insurance (distributed)
  - Pet insurance (distributed)
  - Life insurance and income protection (distributed)
  - Recover Boost accident and critical illness cover
  - Health services delivery via Amplar Health
