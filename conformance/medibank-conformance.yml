# --- Insurance and health data standards ----------------------------------
- id: acord-al3
  conforms: false
  evidence: >-
    No ACORD, AL3, ACORD XML or NGDS reference appears anywhere on the
    Medibank public estate, including the 1,364-URL sitemap. Expected — ACORD
    serves property, casualty and life carriers, not Australian private
    health insurance.
- id: acord-xml
  conforms: false
  evidence: Same as acord-al3; no ACORD publication of any kind.
- id: fhir-r4
  conforms: false
  evidence: >-
    No FHIR endpoint, capability statement or AU Core reference. Australian
    private health insurers carry no FHIR mandate; the payer-side interop
    obligations that force FHIR on US payers have no Australian analogue.
- id: hl7-v2
  conforms: false
  evidence: No HL7 v2 interface documented publicly.
- id: cdr-australia
  conforms: false
  evidence: >-
    The Consumer Data Right was designated to extend to general insurance and
    then deferred and de-prioritised, and would not have reached private
    health insurance in any case. No CDR register participation, no
    /cds-au/v1 surface, no product reference data endpoint.
- id: eclipse-online-claiming
  conforms: true
  first_party: false
  evidence: >-
    Medibank documents ECLIPSE, the Services Australia in-patient online
    claiming system, as the transport for hospital claims and for 25 percent
    Fund Gap medical claims from Simplified Billing Agents under claim type
    "MB", and for the Online Eligibility Check with Presenting Illness codes.
    Registration is with Services Australia, not Medibank. Sources:
    /providers/claims/hospital-claim/ and
    /providers/information-for-simplified-billing-agents/.
- id: hospital-casemix-protocol
  conforms: true
  first_party: partial
  evidence: >-
    Medibank operates an HCP Portal for hospitals to submit Hospital Casemix
    Protocol data, with access granted by emailing hcp@medibank.com.au. The
    HCP specification itself is published by the Australian Department of
    Health and Aged Care. Source: /providers/hospital/.
- id: medicare-benefits-schedule
  conforms: true
  first_party: false
  evidence: >-
    MBS item numbers and ECLIPSE Presenting Illness codes are the claim
    vocabulary Medibank's provider pages instruct against.
- id: hicaps-isoft-terminal-claiming
  conforms: true
  first_party: false
  evidence: >-
    Ancillary (extras) claiming runs through HICAPS and iSOFT practice
    terminals; Medibank maintains a HICAPS and iSOFT updates provider page.

# --- Regulatory posture ---------------------------------------------------
- id: privacy-act-1988-au
  conforms: true
  evidence: >-
    The Medibank privacy policy at https://www.medibank.com.au/privacy/
    states members are "entitled under the Privacy Act 1988 (Cth) to make a
    complaint to the Office of the Australian Information Commissioner".
- id: apra-prudential-supervision
  conforms: true
  evidence: >-
    Medibank Private Limited is a registered private health insurer
    prudentially supervised by APRA; it reports as ASX-listed MPL through
    https://www.medibank.com.au/about/investor-centre/.
- id: private-health-insurance-ombudsman
  conforms: true
  evidence: >-
    Conduct oversight for Australian private health insurance sits with the
    Private Health Insurance Ombudsman, the market-wide regime Medibank
    operates under.
- id: soc2
  conforms: false
  evidence: >-
    No SOC 2 claim is published. No trust centre exists —
    trust.medibank.com.au and security.medibank.com.au do not resolve.
- id: iso-27001
  conforms: false
  evidence: >-
    No ISO 27001 certification claim appears on the privacy page, the
    security and privacy help page, or elsewhere on the public estate.
- id: coordinated-vulnerability-disclosure
  conforms: false
  evidence: >-
    No responsible-disclosure or vulnerability-disclosure page
    (/responsible-disclosure/, /vulnerability-disclosure/, /security/ all
