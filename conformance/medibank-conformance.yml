source: review.yml + live probes of the Medibank public estate on 2026-07-25
note: >-
  Medibank publishes no machine-readable API contract, so nothing here is
  derived from an OpenAPI document. Every entry is grounded either in a
  Medibank-published page (the provider and privacy pages), in a live probe
  recorded in security/medibank-domain-security.yml and
  well-known/medibank-well-known.yml, or in the documented absence recorded in
  review.yml. Australian private health insurance conforms to a government
  data regime — ECLIPSE, the Hospital Casemix Protocol and the Medicare
  Benefits Schedule — rather than to the API and insurance-data standards that
  a property-and-casualty or open-banking carrier would carry. An entry with
  conforms:false is an accurately recorded absence, not an unverified gap.
standards:

# --- API contract and description standards -------------------------------
- id: openapi
  conforms: false
  evidence: >-
    No OpenAPI or Swagger document exists on any Medibank host. api,
    developer, developers, docs and apis subdomains of medibank.com.au either
    do not resolve or refuse public connections; /openapi.json and
    /swagger.json on members.medibank.com.au redirect to /errors/404.html;
    providers.medibank.com.au returns its SPA shell for every path.
- id: asyncapi
  conforms: false
  evidence: No event catalog, webhook documentation or AsyncAPI document was found.
- id: graphql
  conforms: false
  evidence: No /graphql surface was found on any reachable host.
- id: grpc
  conforms: false
  evidence: No published .proto definition and no gRPC reference.
- id: json-schema
  conforms: false
