name: Medibank
kind: company
description: >-
  Medibank Private Limited (ASX: MPL) is Australia's largest private health
  insurer, headquartered in Melbourne and operating two retail brands, Medibank
  and ahm, alongside the Amplar Health services arm. Founded in 1976 as a
  government-owned fund and privatised through an ASX listing in 2014, it
  underwrites hospital, extras and ambulance cover for Australian residents,
  Overseas Student Health Cover and Overseas Visitors Health Cover, and
  distributes travel, pet, life, income protection and accident cover
  (Recover Boost) alongside its core private health insurance book. Its home
  market is Australia, where private health insurance is a separately
  regulated market supervised by APRA and the Private Health Insurance
  Ombudsman, and where the Consumer Data Right that opened banking and energy
  was designated for general insurance and then deferred — so there is no open
  insurance obligation and no CDR seam reaching a health fund like Medibank.
  Medibank's API posture is fully partner-gated and there is no public API.
  No developer portal exists on any conventional host: developer, developers,
  docs and apis subdomains of medibank.com.au do not resolve in DNS,
  api.medibank.com.au resolves but does not accept public TCP connections on
  port 443, and /developers, /api, /developer, /partners and /integrations all
  return HTTP 404 on www.medibank.com.au, whose 1,364-URL sitemap contains no
  developer or API page at all. The only first-party integration surfaces are
  login walls and email-gated onboarding: providers.medibank.com.au is a
  React single-page "Medibank - Provider Self Service" application (Provider
  Central, ESP) that returns its shell for every path, portal.medibank.com.au
  is a Palo Alto GlobalProtect corporate VPN, and the HCP Portal for Hospital
  Casemix Protocol submissions is granted only by emailing Medibank's HCP
  team. The real machine-to-machine claiming rails are third-party and
  government-operated rather than Medibank-published: ECLIPSE, the Services
  Australia in-patient online claiming system, carries hospital claims and
  25 percent Fund Gap medical claims under claim type "MB" and serves Online
  Eligibility Check with Presenting Illness codes, with ECFWeb and THELMA as
  alternative eligibility channels and HICAPS and iSOFT terminals handling
  ancillary claiming. No ACORD reference of any kind appears on Medibank's
  public estate, which is the expected result — Australian private health
  insurance runs on ECLIPSE, HCP and the MBS rather than on ACORD AL3 or
  ACORD XML. No OpenAPI or Swagger definition, no Postman collection, no
  GraphQL or gRPC surface, no webhook or event catalog, and no documented
  authentication scheme could be confirmed anywhere on Medibank's public web
  estate as of 2026-07-25, and none of the four insurance API verbs — quote,
  bind, issue or FNOL — is exposed to unauthenticated developers.
